<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Tricky Mind Academy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#111827,#1e1b4b,#312e81);
    color:white;
    min-height:100vh;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding:18px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.stats{
    display:flex;
    gap:8px;
}

.stat{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    padding:8px 12px;
    border-radius:12px;
    font-size:14px;
}

/* SCREEN */
.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* HOME */
.hero{
    text-align:center;
    padding:45px 20px;
    background:rgba(255,255,255,.08);
    border-radius:25px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.hero .icon{
    font-size:70px;
    margin-bottom:15px;
}

.hero h1{
    font-size:36px;
    margin-bottom:12px;
}

.hero p{
    color:#d1d5db;
    line-height:1.6;
    margin-bottom:25px;
}

.primary-btn{
    border:none;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:white;
    padding:14px 28px;
    border-radius:14px;
    font-size:17px;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(99,102,241,.35);
}

.primary-btn:hover{
    transform:translateY(-2px);
}

/* LEVEL SCREEN */
.section-title{
    margin-bottom:15px;
}

.level-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
}

.level-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:20px 10px;
    text-align:center;
    transition:.2s;
}

.level-card:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.13);
}

.level-number{
    font-size:25px;
    font-weight:bold;
    margin-bottom:7px;
}

.level-type{
    color:#c4b5fd;
    font-size:13px;
}

.locked{
    opacity:.45;
}

.lock-icon{
    font-size:25px;
}

/* GAME */
.game-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:22px;
}

.level-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
    color:#c4b5fd;
}

.question{
    font-size:25px;
    line-height:1.45;
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    text-align:left;
    background:#1f2937;
    border:2px solid #374151;
    color:white;
    padding:15px;
    border-radius:13px;
    font-size:16px;
    transition:.2s;
}

.option:hover{
    border-color:#8b5cf6;
    background:#292f3d;
}

.option.correct{
    background:#14532d;
    border-color:#22c55e;
}

.option.wrong{
    background:#7f1d1d;
    border-color:#ef4444;
}

.feedback{
    min-height:50px;
    margin-top:20px;
    padding:14px;
    border-radius:12px;
    background:rgba(0,0,0,.2);
    line-height:1.5;
}

.next-btn{
    display:none;
    margin-top:15px;
}

/* RESULT */
.result{
    text-align:center;
    padding:35px 20px;
    background:rgba(255,255,255,.08);
    border-radius:22px;
}

.result-icon{
    font-size:65px;
    margin-bottom:15px;
}

.result h2{
    margin-bottom:10px;
}

.result p{
    color:#d1d5db;
    line-height:1.6;
    margin-bottom:20px;
}

/* BACK */
.back-btn{
    border:none;
    background:#374151;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    margin-bottom:15px;
}

/* MOBILE */
@media(max-width:600px){

    .app{
        padding:12px;
    }

    .hero h1{
        font-size:28px;
    }

    .hero .icon{
        font-size:55px;
    }

    .question{
        font-size:21px;
    }

    .header{
        align-items:flex-start;
    }

    .logo{
        font-size:18px;
    }

    .stat{
        padding:7px 8px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="logo">
            🧠 Tricky Mind
        </div>

        <div class="stats">
            <div class="stat">
                ⭐ <span id="score">0</span>
            </div>

            <div class="stat">
                🏆 <span id="progress">0/10</span>
            </div>
        </div>

    </div>


    <!-- HOME SCREEN -->
    <section id="homeScreen" class="screen active">

        <div class="hero">

            <div class="icon">🧠</div>

            <h1>Tricky Mind Academy</h1>

            <p>
                প্রশ্নের উত্তর দাও, Logic ব্যবহার করো,
                Puzzle সমাধান করো এবং ধীরে ধীরে
                কঠিন Level unlock করো!
            </p>

            <button class="primary-btn" onclick="openLevels()">
                🎮 PLAY GAME
            </button>

        </div>

    </section>


    <!-- LEVEL SCREEN -->
    <section id="levelScreen" class="screen">

        <button class="back-btn" onclick="showScreen('homeScreen')">
            ← Home
        </button>

        <h2 class="section-title">
            🎯 Choose Level
        </h2>

        <div id="levelGrid" class="level-grid"></div>

    </section>


    <!-- GAME SCREEN -->
    <section id="gameScreen" class="screen">

        <button class="back-btn" onclick="openLevels()">
            ← Levels
        </button>

        <div class="game-card">

            <div class="level-info">

                <span id="levelTitle">
                    Level 1
                </span>

                <span id="questionNumber">
                    Question
                </span>

            </div>

            <div id="question" class="question"></div>

            <div id="options" class="options"></div>

            <div id="feedback" class="feedback"></div>

            <button
                id="nextButton"
                class="primary-btn next-btn"
                onclick="nextQuestion()">
                Next →
            </button>

        </div>

    </section>


    <!-- RESULT SCREEN -->
    <section id="resultScreen" class="screen">

        <div class="result">

            <div class="result-icon">
                🎉
            </div>

            <h2>Level Complete!</h2>

            <p id="resultText"></p>

            <button
                class="primary-btn"
                onclick="openLevels()">
                Choose Next Level
            </button>

        </div>

    </section>

</div>


<script>

/* =====================================================
   GAME DATA
   নতুন Level এখানে যোগ করা যাবে
   ===================================================== */

const levels = [

    {
        id:1,
        type:"MCQ",
        title:"Tricky Question",

        questions:[
            {
                question:"একটি ঘরে ৫টি মোমবাতি জ্বলছে। ২টি মোমবাতি নিভিয়ে দেওয়া হলো। ঘরে মোট কতটি মোমবাতি রইল?",

                options:[
                    "২টি",
                    "৩টি",
                    "৫টি",
                    "৭টি"
                ],

                answer:2,

                explanation:
                "মোমবাতি নিভে গেলেও ঘর থেকে চলে যায়নি। তাই মোট ৫টি মোমবাতিই আছে।"
            }
        ]
    },


    {
        id:2,
        type:"MCQ",
        title:"Position Logic",

        questions:[
            {
                question:
                "একটি দৌড়ে তুমি দ্বিতীয় স্থানে থাকা ব্যক্তিকে পেরিয়ে গেলে। এখন তুমি কোন স্থানে?",

                options:[
                    "প্রথম",
                    "দ্বিতীয়",
                    "তৃতীয়",
                    "চতুর্থ"
                ],

                answer:1,

                explanation:
                "তুমি দ্বিতীয় ব্যক্তিকে পেরিয়েছো, তাই তার জায়গা অর্থাৎ দ্বিতীয় স্থানে গেছো।"
            }
        ]
    },


    {
        id:3,
        type:"MCQ",
        title:"Number Logic",

        questions:[
            {
                question:
                "ধারাটি দেখো: 2, 4, 6, 8, ?",

                options:[
                    "9",
                    "10",
                    "11",
                    "12"
                ],

                answer:1,

                explanation:
                "প্রতিবার ২ করে বাড়ছে। তাই উত্তর ১০।"
            }
        ]
    },


    {
        id:4,
        type:"MCQ",
        title:"Thinking Challenge",

        questions:[
            {
                question:
                "তোমার কাছে ৩টি আপেল আছে। তুমি ২টি নিয়ে নিলে তোমার কাছে কতটি আপেল থাকবে?",

                options:[
                    "১টি",
                    "২টি",
                    "৩টি",
                    "৫টি"
                ],

                answer:1,

                explanation:
                "তুমি ২টি আপেল নিয়ে নিয়েছো, তাই তোমার কাছে ২টি থাকবে।"
            }
        ]
    },


    {
        id:5,
        type:"MCQ",
        title:"Logic Test",

        questions:[
            {
                question:
                "একটি ঘড়িতে ৩টা বাজলে ঘণ্টার কাঁটা ও মিনিটের কাঁটার মধ্যে কোণ কত?",

                options:[
                    "30°",
                    "60°",
                    "90°",
                    "180°"
                ],

                answer:2,

                explanation:
                "৩টার সময় ঘণ্টার কাঁটা ৩-এর দিকে এবং মিনিটের কাঁটা ১২-এর দিকে থাকে। কোণ ৯০°।"
            }
        ]
    },


    {
        id:6,
        type:"MCQ",
        title:"Pattern",

        questions:[
            {
                question:
                "1, 3, 5, 7, ?",

                options:[
                    "8",
                    "9",
                    "10",
                    "11"
                ],

                answer:1,

                explanation:
                "প্রতিবার ২ করে বাড়ছে। তাই উত্তর ৯।"
            }
        ]
    },


    {
        id:7,
        type:"MCQ",
        title:"Quick Logic",

        questions:[
            {
                question:
                "একটি সপ্তাহে মোট কত দিন?",

                options:[
                    "5",
                    "6",
                    "7",
                    "8"
                ],

                answer:2,

                explanation:
                "এক সপ্তাহে ৭ দিন।"
            }
        ]
    },


    {
        id:8,
        type:"MCQ",
        title:"Number Challenge",

        questions:[
            {
                question:
                "5 × 5 = ?",

                options:[
                    "10",
                    "20",
                    "25",
                    "30"
                ],

                answer:2,

                explanation:
                "৫ × ৫ = ২৫।"
            }
        ]
    },


    {
        id:9,
        type:"MCQ",
        title:"Science",

        questions:[
            {
                question:
                "মানুষ শ্বাস নেওয়ার সময় প্রধানত কোন গ্যাস গ্রহণ করে?",

                options:[
                    "অক্সিজেন",
                    "কার্বন ডাই-অক্সাইড",
                    "হিলিয়াম",
                    "হাইড্রোজেন"
                ],

                answer:0,

                explanation:
                "মানুষ শ্বাস নেওয়ার সময় অক্সিজেন গ্রহণ করে।"
            }
        ]
    },


    {
        id:10,
        type:"MCQ",
        title:"Final Challenge",

        questions:[
            {
                question:
                "একটি সংখ্যার দ্বিগুণ ২০ হলে সংখ্যাটি কত?",

                options:[
                    "5",
                    "10",
                    "15",
                    "20"
                ],

                answer:1,

                explanation:
                "10 × 2 = 20। তাই উত্তর ১০।"
            }
        ]
    }

];


/* =====================================================
   GAME STATE
   ===================================================== */

let score = 0;

let unlockedLevel = 1;

let currentLevel = null;

let currentQuestion = 0;

let answered = false;


/* =====================================================
   STARTUP
   ===================================================== */

loadGame();

renderLevels();

updateStats();


/* =====================================================
   SCREEN SYSTEM
   ===================================================== */

function showScreen(id){

    document.querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");
}


/* =====================================================
   OPEN LEVELS
   ===================================================== */

function openLevels(){

    renderLevels();

    showScreen("levelScreen");
}


/* =====================================================
   LEVEL LIST
   ===================================================== */

function renderLevels(){

    const grid =
        document.getElementById("levelGrid");

    grid.innerHTML = "";

    levels.forEach(level => {

        const card =
            document.createElement("div");

        const unlocked =
            level.id <= unlockedLevel;

        card.className =
            "level-card " +
            (unlocked ? "" : "locked");

        if(unlocked){

            card.innerHTML = `

                <div class="level-number">
                    ${level.id}
                </div>

                <div class="level-type">
                    ${level.type}
                </div>

                <div style="margin-top:8px;">
                    ${level.title}
                </div>

            `;

            card.onclick = function(){
                startLevel(level.id);
            };

        }else{

            card.innerHTML = `

                <div class="lock-icon">
                    🔒
                </div>

                <div class="level-number">
                    Level ${level.id}
                </div>

                <div class="level-type">
                    Locked
                </div>

            `;
        }

        grid.appendChild(card);
    });
}


/* =====================================================
   START LEVEL
   ===================================================== */

function startLevel(levelId){

    currentLevel =
        levels.find(level => level.id === levelId);

    if(!currentLevel){
        return;
    }

    currentQuestion = 0;

    answered = false;

    showScreen("gameScreen");

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showQuestion(){

    const q =
        currentLevel.questions[currentQuestion];

    answered = false;

    document.getElementById("levelTitle")
        .textContent =
        `Level ${currentLevel.id} • ${currentLevel.title}`;

    document.getElementById("questionNumber")
        .textContent =
        `${currentQuestion + 1}/${currentLevel.questions.length}`;

    document.getElementById("question")
        .textContent =
        q.question;

    document.getElementById("feedback")
        .textContent =
        "উত্তরটি বেছে নাও 👇";

    document.getElementById("nextButton")
        .style.display = "none";

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach((option,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.onclick = function(){

            checkAnswer(index,button);

        };

        options.appendChild(button);

    });
}


/* =====================================================
   CHECK ANSWER
   ===================================================== */

function checkAnswer(selected,button){

    if(answered){
        return;
    }

    answered = true;

    const q =
        currentLevel.questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".option");

    allButtons.forEach(btn=>{
        btn.disabled = true;
    });


    if(selected === q.answer){

        button.classList.add("correct");

        score += 10;

        document.getElementById("feedback")
            .innerHTML =
            "✅ <b>সঠিক উত্তর!</b><br>" +
            q.explanation;

    }else{

        button.classList.add("wrong");

        allButtons[q.answer]
            .classList.add("correct");

        document.getElementById("feedback")
            .innerHTML =
            "❌ <b>ভুল উত্তর!</b><br>" +
            "সঠিক উত্তর: " +
            q.options[q.answer] +
            "<br><br>" +
            q.explanation;
    }


    updateStats();

    saveGame();

    document.getElementById("nextButton")
        .style.display = "inline-block";
}


/* =====================================================
   NEXT QUESTION
   ===================================================== */

function nextQuestion(){

    currentQuestion++;

    if(
        currentQuestion >=
        currentLevel.questions.length
    ){

        finishLevel();

        return;
    }

    showQuestion();
}


/* =====================================================
   FINISH LEVEL
   ===================================================== */

function finishLevel(){

    if(currentLevel.id === unlockedLevel){

        unlockedLevel++;

        if(unlockedLevel > levels.length){

            unlockedLevel = levels.length;

        }
    }

    saveGame();

    updateStats();

    document.getElementById("resultText")
        .textContent =
        `তুমি Level ${currentLevel.id} শেষ করেছো! ` +
        `তোমার বর্তমান Score ${score} ⭐`;

    showScreen("resultScreen");
}


/* =====================================================
   STATS
   ===================================================== */

function updateStats(){

    document.getElementById("score")
        .textContent = score;

    document.getElementById("progress")
        .textContent =
        `${Math.min(unlockedLevel - 1,levels.length)}/${levels.length}`;
}


/* =====================================================
   SAVE GAME
   ===================================================== */

function saveGame(){

    localStorage.setItem(
        "trickyMindScore",
        score
    );

    localStorage.setItem(
        "trickyMindUnlocked",
        unlockedLevel
    );
}


/* =====================================================
   LOAD GAME
   ===================================================== */

function loadGame(){

    const savedScore =
        localStorage.getItem("trickyMindScore");

    const savedLevel =
        localStorage.getItem("trickyMindUnlocked");

    if(savedScore !== null){

        score =
            Number(savedScore);
    }

    if(savedLevel !== null){

        unlockedLevel =
            Number(savedLevel);
    }

    if(unlockedLevel < 1){
        unlockedLevel = 1;
    }
}


/* =====================================================
   FUTURE GAME SYSTEM
   ===================================================== */

/*
   ভবিষ্যতে এখানে আমরা যোগ করব:

   1. 🧩 BLOCK PUZZLE
   2. 🤖 ROBOT MOVEMENT
   3. 🔁 REPEAT BLOCK
   4. ❓ IF / ELSE
   5. 🔢 VARIABLE
   6. 🧮 MATH PUZZLE
   7. 🔬 SCIENCE LEVEL
   8. 💻 CODING LOGIC
   9. 🐛 DEBUGGING
   10. 🏆 ACHIEVEMENT
   11. ❤️ LIFE SYSTEM
   12. 💰 COIN SYSTEM
   13. 🛍️ SHOP
   14. 🌎 WORLD / MAP
   15. 🔥 DAILY CHALLENGE

   নতুন content পুরনো system-এর সঙ্গে
   যোগ করা হবে।
*/

</script>

</body>
  </html>
